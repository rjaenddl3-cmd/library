<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테트리스 (Tetris Game)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tone.js for Sound Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            touch-action: manipulation;
        }
        .pixel-font {
            font-family: 'Press Start 2P', monospace;
        }
        /* Glassmorphic card styling */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        /* Neon Glow Effects */
        .glow-title {
            text-shadow: 0 0 10px #3b82f6, 0 0 20px #3b82f6;
        }
        .btn-action {
            transition: all 0.1s ease;
            user-select: none;
            -webkit-user-select: none;
        }
        .btn-action:active {
            transform: scale(0.95);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 select-none">

    <!-- Header Section -->
    <header class="text-center mb-3">
        <h1 class="text-3xl sm:text-4xl font-extrabold pixel-font text-blue-400 glow-title tracking-wider">
            TETRIS
        </h1>
    </header>

    <!-- Main Game Container -->
    <div class="flex flex-col lg:flex-row items-center justify-center gap-4 w-full max-w-4xl">
        
        <!-- Left Panel: Hold & Audio Control -->
        <div class="flex lg:flex-col gap-3 w-full lg:w-44 justify-between order-2 lg:order-1">
            <!-- Hold Box -->
            <div class="glass-panel p-3 rounded-xl flex-1 flex flex-col items-center justify-center">
                <span class="text-xs font-bold text-slate-400 mb-2 uppercase tracking-widest pixel-font">HOLD (C)</span>
                <canvas id="holdCanvas" width="100" height="100" class="bg-slate-900/80 rounded-lg border border-slate-700/50"></canvas>
            </div>

            <!-- Stats Box (Mobile compact/Desktop regular) -->
            <div class="glass-panel p-3 rounded-xl flex-1 flex flex-col justify-around text-center gap-2">
                <div>
                    <div class="text-[10px] text-slate-400 uppercase pixel-font">Score</div>
                    <div id="score" class="text-lg sm:text-xl font-bold text-yellow-400 pixel-font mt-1">0</div>
                </div>
                <div>
                    <div class="text-[10px] text-slate-400 uppercase pixel-font">Lines</div>
                    <div id="lines" class="text-lg sm:text-xl font-bold text-green-400 pixel-font mt-1">0</div>
                </div>
                <div>
                    <div class="text-[10px] text-slate-400 uppercase pixel-font">Level</div>
                    <div id="level" class="text-lg sm:text-xl font-bold text-purple-400 pixel-font mt-1">1</div>
                </div>
            </div>
        </div>

        <!-- Center: Main Game Board -->
        <div class="relative order-1 lg:order-2">
            <div class="glass-panel p-2 sm:p-3 rounded-2xl border-2 border-slate-700/60 shadow-2xl relative">
                <canvas id="tetrisCanvas" width="240" height="480" class="bg-slate-950 rounded-lg block mx-auto"></canvas>

                <!-- Overlay for Pause / Game Over / Start -->
                <div id="gameOverlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center gap-4 p-6 transition-all duration-300">
                    <h2 id="overlayTitle" class="text-2xl sm:text-3xl font-bold pixel-font text-yellow-400 text-center">TETRIS</h2>
                    <p id="overlaySub" class="text-sm text-slate-300 text-center">클래식 테트리스 게임에 오신 것을 환영합니다!</p>
                    <button id="startBtn" class="px-6 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold rounded-xl shadow-lg hover:shadow-blue-500/50 transition-all transform hover:-translate-y-0.5 active:translate-y-0 pixel-font text-xs">
                        게임 시작
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Panel: Next Piece & Controls Info -->
        <div class="flex lg:flex-col gap-3 w-full lg:w-44 justify-between order-3">
            <!-- Next Box -->
            <div class="glass-panel p-3 rounded-xl flex-1 flex flex-col items-center justify-center">
                <span class="text-xs font-bold text-slate-400 mb-2 uppercase tracking-widest pixel-font">NEXT</span>
                <canvas id="nextCanvas" width="100" height="100" class="bg-slate-900/80 rounded-lg border border-slate-700/50"></canvas>
            </div>

            <!-- Controls Info / Mute Button -->
            <div class="glass-panel p-3 rounded-xl flex-1 flex flex-col justify-between">
                <button id="soundToggleBtn" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 border border-slate-600 transition">
                    <i id="soundIcon" class="fas fa-volume-up"></i>
                    <span id="soundText">사운드 ON</span>
                </button>
                
                <div class="hidden lg:block mt-3 pt-3 border-t border-slate-700/50 text-[11px] text-slate-400 space-y-1">
                    <div class="font-bold text-slate-300 mb-1">조작키:</div>
                    <div>← / → : 이동</div>
                    <div>↑ : 회전</div>
                    <div>↓ : 소프트 드롭</div>
                    <div>Space : 하드 드롭</div>
                    <div>C / Shift : Hold</div>
                    <div>P : 일시정지</div>
                </div>
            </div>
        </div>

    </div>

    <!-- On-screen Touch Controls (Visible on mobile/tablet or touch screens) -->
    <div class="w-full max-w-md mt-4 glass-panel p-3 rounded-2xl flex flex-col gap-2">
        <!-- Top Row: Rotate, Hold, Pause -->
        <div class="flex justify-between gap-2">
            <button id="btnHold" class="btn-action flex-1 py-3 bg-purple-600/40 border border-purple-500/50 hover:bg-purple-600/60 text-purple-200 rounded-xl font-bold flex items-center justify-center text-sm active:bg-purple-600">
                HOLD
            </button>
            <button id="btnRotate" class="btn-action flex-1 py-3 bg-blue-600/40 border border-blue-500/50 hover:bg-blue-600/60 text-blue-200 rounded-xl font-bold flex items-center justify-center text-sm active:bg-blue-600">
                <i class="fas fa-redo mr-1"></i> 회전
            </button>
            <button id="btnPause" class="btn-action px-4 py-3 bg-slate-700/50 border border-slate-600 hover:bg-slate-600 text-slate-300 rounded-xl font-bold flex items-center justify-center text-sm">
                <i class="fas fa-pause"></i>
            </button>
        </div>

        <!-- Bottom Row: Left, Down, Right, Hard Drop -->
        <div class="grid grid-cols-4 gap-2">
            <button id="btnLeft" class="btn-action py-3 bg-slate-800/80 border border-slate-700 hover:bg-slate-700 text-slate-200 rounded-xl font-bold text-lg flex items-center justify-center active:bg-slate-600">
                <i class="fas fa-arrow-left"></i>
            </button>
            <button id="btnDown" class="btn-action py-3 bg-slate-800/80 border border-slate-700 hover:bg-slate-700 text-slate-200 rounded-xl font-bold text-lg flex items-center justify-center active:bg-slate-600">
                <i class="fas fa-arrow-down"></i>
            </button>
            <button id="btnRight" class="btn-action py-3 bg-slate-800/80 border border-slate-700 hover:bg-slate-700 text-slate-200 rounded-xl font-bold text-lg flex items-center justify-center active:bg-slate-600">
                <i class="fas fa-arrow-right"></i>
            </button>
            <button id="btnDrop" class="btn-action py-3 bg-emerald-600/40 border border-emerald-500/50 hover:bg-emerald-600/60 text-emerald-200 rounded-xl font-bold text-sm flex items-center justify-center active:bg-emerald-600">
                DROP
            </button>
        </div>
    </div>

    <!-- Game Logic Script -->
    <script>
        // --- Game Constants & Configuration ---
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 24; // Pixel size per block cell

        // Tetromino Shapes and Color Palette
        const SHAPES = [
            [], // Empty
            [[1, 1, 1, 1]], // I (Cyan)
            [[1, 1, 1], [0, 1, 0]], // T (Purple)
            [[1, 1, 1], [1, 0, 0]], // L (Orange)
            [[1, 1, 1], [0, 0, 1]], // J (Blue)
            [[1, 1], [1, 1]],       // O (Yellow)
            [[0, 1, 1], [1, 1, 0]], // S (Green)
            [[1, 1, 0], [0, 1, 1]]  // Z (Red)
        ];

        const COLORS = [
            null,
            '#06b6d4', // I - Cyan
            '#a855f7', // T - Purple
            '#f97316', // L - Orange
            '#3b82f6', // J - Blue
            '#eab308', // O - Yellow
            '#22c55e', // S - Green
            '#ef4444'  // Z - Red
        ];

        const SHADOW_COLORS = [
            null,
            '#083344', '#3b0764', '#431407', '#172554', '#422006', '#052e16', '#450a0a'
        ];

        // --- Sound Engine (Tone.js Integration) ---
        let soundEnabled = true;
        let synth, noiseSynth;

        function initAudio() {
            try {
                synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: 'triangle' },
                    envelope: { attack: 0.005, decay: 0.1, sustain: 0, release: 0.1 }
                }).toDestination();
                synth.volume.value = -12;

                noiseSynth = new Tone.NoiseSynth({
                    noise: { type: 'white' },
                    envelope: { attack: 0.005, decay: 0.15, sustain: 0 }
                }).toDestination();
                noiseSynth.volume.value = -18;
            } catch (e) {
                console.log("Audio initialization skipped or failed:", e);
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            Tone.start();
            try {
                if (type === 'move') {
                    synth.triggerAttackRelease("C3", "32n");
                } else if (type === 'rotate') {
                    synth.triggerAttackRelease("E4", "32n");
                } else if (type === 'drop') {
                    synth.triggerAttackRelease("C2", "16n");
                } else if (type === 'clear') {
                    synth.triggerAttackRelease(["C4", "E4", "G4", "C5"], "16n");
                } else if (type === 'gameover') {
                    synth.triggerAttackRelease(["C3", "F#2", "C2"], "8n");
                } else if (type === 'hold') {
                    synth.triggerAttackRelease("G3", "32n");
                }
            } catch(e) {}
        }

        // --- Canvas Setup ---
        const canvas = document.getElementById('tetrisCanvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextCanvas');
        const nextCtx = nextCanvas.getContext('2d');
        const holdCanvas = document.getElementById('holdCanvas');
        const holdCtx = holdCanvas.getContext('2d');

        // UI Element References
        const scoreEl = document.getElementById('score');
        const linesEl = document.getElementById('lines');
        const levelEl = document.getElementById('level');
        const overlay = document.getElementById('gameOverlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlaySub = document.getElementById('overlaySub');
        const startBtn = document.getElementById('startBtn');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');
        const soundText = document.getElementById('soundText');

        // --- Game State Variables ---
        let board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        let score = 0;
        let lines = 0;
        let level = 1;
        let gameOver = false;
        let isPaused = false;
        let gameStarted = false;

        let currentPiece = null;
        let nextPiece = null;
        let holdPiece = null;
        let canHold = true;

        let lastTime = 0;
        let dropCounter = 0;
        let dropInterval = 1000; // Drops every 1 sec at level 1
        let animationFrameId = null;

        // Piece Class
        class Piece {
            constructor(typeIdx) {
                this.typeIdx = typeIdx;
                this.shape = SHAPES[typeIdx];
                this.color = COLORS[typeIdx];
                this.x = Math.floor((COLS - this.shape[0].length) / 2);
                this.y = 0;
            }

            rotate() {
                // Matrix transposition + row reverse
                const newShape = this.shape[0].map((_, colIndex) =>
                    this.shape.map(row => row[colIndex]).reverse()
                );
                return newShape;
            }
        }

        // --- Helper Functions ---
        function getRandomPieceIdx() {
            return Math.floor(Math.random() * 7) + 1;
        }

        function createPiece() {
            if (!nextPiece) {
                nextPiece = new Piece(getRandomPieceIdx());
            }
            currentPiece = nextPiece;
            nextPiece = new Piece(getRandomPieceIdx());
            canHold = true;

            // Spawn collision check (Game Over condition)
            if (collide(board, currentPiece)) {
                gameOver = true;
                playSound('gameover');
                showOverlay("GAME OVER", `최종 점수: ${score}점`);
            }
        }

        function collide(board, piece, offset = { x: 0, y: 0 }, shape = piece.shape) {
            for (let y = 0; y < shape.length; y++) {
                for (let x = 0; x < shape[y].length; x++) {
                    if (shape[y][x] !== 0) {
                        const newX = piece.x + x + offset.x;
                        const newY = piece.y + y + offset.y;

                        if (newX < 0 || newX >= COLS || newY >= ROWS) {
                            return true;
                        }
                        if (newY >= 0 && board[newY][newX] !== 0) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function merge(board, piece) {
            piece.shape.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        const boardY = piece.y + y;
                        if (boardY >= 0) {
                            board[boardY][piece.x + x] = piece.typeIdx;
                        }
                    }
                });
            });
        }

        // Wall kick supported rotation
        function playerRotate() {
            if (!currentPiece) return;
            const originalShape = currentPiece.shape;
            const rotatedShape = currentPiece.rotate();
            
            // Basic Wall Kicks offsets to test
            const offsets = [0, 1, -1, 2, -2];
            
            for (let offset of offsets) {
                if (!collide(board, currentPiece, { x: offset, y: 0 }, rotatedShape)) {
                    currentPiece.shape = rotatedShape;
                    currentPiece.x += offset;
                    playSound('rotate');
                    return;
                }
            }
        }

        function playerMove(dir) {
            if (!currentPiece || gameOver || isPaused) return;
            if (!collide(board, currentPiece, { x: dir, y: 0 })) {
                currentPiece.x += dir;
                playSound('move');
            }
        }

        function playerDrop() {
            if (!currentPiece || gameOver || isPaused) return;
            if (!collide(board, currentPiece, { x: 0, y: 1 })) {
                currentPiece.y++;
                dropCounter = 0;
            } else {
                lockPiece();
            }
        }

        function hardDrop() {
            if (!currentPiece || gameOver || isPaused) return;
            while (!collide(board, currentPiece, { x: 0, y: 1 })) {
                currentPiece.y++;
            }
            playSound('drop');
            lockPiece();
        }

        function lockPiece() {
            merge(board, currentPiece);
            clearLines();
            createPiece();
            draw();
        }

        function holdCurrentPiece() {
            if (!canHold || !currentPiece || gameOver || isPaused) return;

            playSound('hold');
            if (holdPiece === null) {
                holdPiece = new Piece(currentPiece.typeIdx);
                createPiece();
            } else {
                const tempType = currentPiece.typeIdx;
                currentPiece = new Piece(holdPiece.typeIdx);
                holdPiece = new Piece(tempType);
            }
            canHold = false;
        }

        function clearLines() {
            let linesCleared = 0;

            outer: for (let y = ROWS - 1; y >= 0; y--) {
                for (let x = 0; x < COLS; x++) {
                    if (board[y][x] === 0) {
                        continue outer;
                    }
                }

                // Row is full
                const row = board.splice(y, 1)[0].fill(0);
                board.unshift(row);
                linesCleared++;
                y++; // Re-check the same index since rows shifted
            }

            if (linesCleared > 0) {
                playSound('clear');
                lines += linesCleared;

                // Classic Scoring formula
                const linePoints = [0, 100, 300, 500, 800];
                score += linePoints[linesCleared] * level;

                // Level up every 10 lines
                level = Math.floor(lines / 10) + 1;
                dropInterval = Math.max(100, 1000 - (level - 1) * 90);

                updateUI();
            }
        }

        function getGhostPosition() {
            if (!currentPiece) return 0;
            let ghostY = currentPiece.y;
            while (!collide(board, currentPiece, { x: 0, y: ghostY - currentPiece.y + 1 })) {
                ghostY++;
            }
            return ghostY;
        }

        // --- Rendering / Drawing Methods ---
        function drawBlock(context, x, y, colorIdx, isGhost = false) {
            const color = COLORS[colorIdx];
            const px = x * BLOCK_SIZE;
            const py = y * BLOCK_SIZE;

            if (isGhost) {
                context.strokeStyle = color;
                context.lineWidth = 1.5;
                context.strokeRect(px + 2, py + 2, BLOCK_SIZE - 4, BLOCK_SIZE - 4);
                return;
            }

            // Fill Block
            context.fillStyle = color;
            context.fillRect(px, py, BLOCK_SIZE, BLOCK_SIZE);

            // Bevel Highlight & Shadow Effects
            context.fillStyle = 'rgba(255, 255, 255, 0.3)';
            context.fillRect(px, py, BLOCK_SIZE, 3);
            context.fillRect(px, py, 3, BLOCK_SIZE);

            context.fillStyle = 'rgba(0, 0, 0, 0.35)';
            context.fillRect(px, py + BLOCK_SIZE - 3, BLOCK_SIZE, 3);
            context.fillRect(px + BLOCK_SIZE - 3, py, 3, BLOCK_SIZE);

            // Inner Border
            context.strokeStyle = 'rgba(15, 23, 42, 0.5)';
            context.strokeRect(px, py, BLOCK_SIZE, BLOCK_SIZE);
        }

        function drawBoard() {
            // Draw Grid lines
            ctx.strokeStyle = 'rgba(51, 65, 85, 0.3)';
            ctx.lineWidth = 0.5;

            for (let r = 0; r <= ROWS; r++) {
                ctx.beginPath();
                ctx.moveTo(0, r * BLOCK_SIZE);
                ctx.lineTo(COLS * BLOCK_SIZE, r * BLOCK_SIZE);
                ctx.stroke();
            }
            for (let c = 0; c <= COLS; c++) {
                ctx.beginPath();
                ctx.moveTo(c * BLOCK_SIZE, 0);
                ctx.lineTo(c * BLOCK_SIZE, ROWS * BLOCK_SIZE);
                ctx.stroke();
            }

            // Draw Matrix
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c] !== 0) {
                        drawBlock(ctx, c, r, board[r][c]);
                    }
                }
            }
        }

        function drawPiece(context, piece, offsetX = 0, offsetY = 0, isGhost = false) {
            if (!piece) return;
            piece.shape.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        drawBlock(context, piece.x + x + offsetX, piece.y + y + offsetY, piece.typeIdx, isGhost);
                    }
                });
            });
        }

        function drawMiniCanvas(context, piece, width, height) {
            context.clearRect(0, 0, width, height);
            if (!piece) return;

            const shape = piece.shape;
            const rows = shape.length;
            const cols = shape[0].length;

            const miniBlockSize = 20;
            const startX = (width - cols * miniBlockSize) / 2;
            const startY = (height - rows * miniBlockSize) / 2;

            shape.forEach((row, r) => {
                row.forEach((val, c) => {
                    if (val !== 0) {
                        const px = startX + c * miniBlockSize;
                        const py = startY + r * miniBlockSize;
                        const color = COLORS[piece.typeIdx];

                        context.fillStyle = color;
                        context.fillRect(px, py, miniBlockSize, miniBlockSize);

                        // Highlight & Shadow
                        context.fillStyle = 'rgba(255, 255, 255, 0.25)';
                        context.fillRect(px, py, miniBlockSize, 2);
                        context.fillRect(px, py, 2, miniBlockSize);

                        context.strokeStyle = 'rgba(0, 0, 0, 0.5)';
                        context.strokeRect(px, py, miniBlockSize, miniBlockSize);
                    }
                });
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawBoard();

            if (currentPiece) {
                // Draw Ghost Piece
                const ghostY = getGhostPosition();
                drawPiece(ctx, currentPiece, 0, ghostY - currentPiece.y, true);

                // Draw Active Piece
                drawPiece(ctx, currentPiece);
            }

            // Draw Previews
            drawMiniCanvas(nextCtx, nextPiece, nextCanvas.width, nextCanvas.height);
            drawMiniCanvas(holdCtx, holdPiece, holdCanvas.width, holdCanvas.height);
        }

        function updateUI() {
            scoreEl.textContent = score;
            linesEl.textContent = lines;
            levelEl.textContent = level;
        }

        // --- Main Game Loop ---
        function update(time = 0) {
            if (!gameStarted || gameOver || isPaused) return;

            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }

            draw();
            animationFrameId = requestAnimationFrame(update);
        }

        // --- Overlay & Game Lifecycle Management ---
        function showOverlay(title, subtitle) {
            overlayTitle.textContent = title;
            overlaySub.textContent = subtitle;
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
        }

        function hideOverlay() {
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
        }

        function startNewGame() {
            initAudio();
            board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            score = 0;
            lines = 0;
            level = 1;
            dropInterval = 1000;
            gameOver = false;
            isPaused = false;
            gameStarted = true;
            holdPiece = null;
            nextPiece = null;

            updateUI();
            createPiece();
            hideOverlay();

            lastTime = performance.now();
            dropCounter = 0;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(update);
        }

        function togglePause() {
            if (!gameStarted || gameOver) return;
            isPaused = !isPaused;
            if (isPaused) {
                showOverlay("PAUSED", "일시 정지 상태입니다.");
                startBtn.textContent = "계속 하기";
            } else {
                hideOverlay();
                lastTime = performance.now();
                animationFrameId = requestAnimationFrame(update);
            }
        }

        // --- Controls & Event Listeners ---
        document.addEventListener('keydown', (e) => {
            if (!gameStarted || gameOver) return;

            switch (e.code) {
                case 'ArrowLeft':
                    playerMove(-1);
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                    playerMove(1);
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                    playerDrop();
                    e.preventDefault();
                    break;
                case 'ArrowUp':
                    playerRotate();
                    e.preventDefault();
                    break;
                case 'Space':
                    hardDrop();
                    e.preventDefault();
                    break;
                case 'KeyC':
                case 'ShiftLeft':
                case 'ShiftRight':
                    holdCurrentPiece();
                    e.preventDefault();
                    break;
                case 'KeyP':
                    togglePause();
                    e.preventDefault();
                    break;
            }
        });

        // Touch Control Buttons
        document.getElementById('btnLeft').addEventListener('click', () => playerMove(-1));
        document.getElementById('btnRight').addEventListener('click', () => playerMove(1));
        document.getElementById('btnDown').addEventListener('click', () => playerDrop());
        document.getElementById('btnRotate').addEventListener('click', () => playerRotate());
        document.getElementById('btnDrop').addEventListener('click', () => hardDrop());
        document.getElementById('btnHold').addEventListener('click', () => holdCurrentPiece());
        document.getElementById('btnPause').addEventListener('click', () => togglePause());

        // Overlay Button Listener
        startBtn.addEventListener('click', () => {
            if (isPaused) {
                togglePause();
            } else {
                startNewGame();
            }
        });

        // Audio Toggle Switch
        soundToggleBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                soundIcon.className = "fas fa-volume-up";
                soundText.textContent = "사운드 ON";
            } else {
                soundIcon.className = "fas fa-volume-mute";
                soundText.textContent = "사운드 OFF";
            }
        });

        // Initial Canvas Rendering
        window.onload = () => {
            drawBoard();
        };
    </script>
</body>
</html>
